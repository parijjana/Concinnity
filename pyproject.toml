[project]
name = "global-icebox"
version = "0.1.0"
description = "Local stdio MCP server for Concinnity idea lanes and priority preferences."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2.0",
]

[project.scripts]
concinnity = "global_icebox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/global_icebox"]

[tool.uv]
package = true
