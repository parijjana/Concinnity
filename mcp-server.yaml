schema_version: 1
id: global-icebox
name: Concinnity
version: 0.1.0
description: Captures lane-scoped development ideas and priority preferences in a local SQLite store.

enabled: true
autostart: false
restart_policy: never

lifecycle:
  type: command_per_client

entrypoint:
  type: command
  command: uv
  args:
    - run
    - python
    - -m
    - global_icebox
  working_directory: .
  env:
    UV_CACHE_DIR: .uv-cache

transport:
  type: stdio

scripts:
  start: scripts/start.ps1
  test: scripts/test.ps1
  launch_ui: scripts/launch-ui.ps1
  start_posix: scripts/start.sh
  test_posix: scripts/test.sh

health:
  type: mcp_initialize
  timeout_seconds: 5

ports: []

logs:
  stdout: ""
  stderr: logs/stderr.log

metadata:
  repository: ""
  license: MIT
  tags:
    - icebox
    - concinnity
    - ideas
    - priority
    - stdio
    - sqlite
